name: Update lectures and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum new videos to process (1–15)"
        required: false
        default: "1"

concurrency:
  group: pages-and-ingestion
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect and summarize new uploads
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INGEST_LIMIT: ${{ github.event.inputs.limit || '1' }}
        run: npm run ingest -- --limit "$INGEST_LIMIT"

      - name: Test ingestion safeguards
        run: npm test

      - name: Build static website
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Detect generated content changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- src/content/lectures scripts/data/processed-videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit generated articles
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/lectures scripts/data/processed-videos.json
          git commit -m "content: add new lecture summaries"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
